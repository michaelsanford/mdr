name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Replaces the workflow-level `paths-ignore` that used to sit on both
  # triggers. A workflow skipped by a path filter never reports its check
  # contexts, so the ruleset's required checks stayed pending for ever and a
  # docs-only pull request could never be merged. A job skipped by `if:`
  # reports success instead, which does satisfy the ruleset.
  # https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Decide whether the rest of the workflow needs to run
        id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE_SHA...HEAD"
          else
            range="$BEFORE_SHA..HEAD"
          fi

          # Anything unexpected - a first push, a force push, a pruned object -
          # runs the full workflow rather than silently skipping it.
          if ! files=$(git diff --name-only "$range" 2>/dev/null); then
            echo "Could not diff $range; running the workflow."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|docs/*|.github/FUNDING.yml|.github/workflows/release.yml|.github/workflows/winget.yml) continue ;;
            esac
            echo "relevant change: $f"
            code=true
          done <<< "$files"

          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = "true" ] || echo "Only ignored paths changed; downstream jobs will skip."

  build:
    needs: changes
    # The guard is per-step, not on the job. A matrix job skipped by a
    # job-level `if:` is never expanded, so it reports one check literally
    # named "build (${{ matrix.rid }})" and the ruleset's eight required
    # "build (<rid>)" contexts never report at all. Letting the matrix expand
    # and skipping the work inside keeps every context reporting success.
    # Explicit name keeps the check context as "build (<rid>)" so it matches the
    # branch ruleset's required status checks even though the matrix now carries
    # extra dimensions (os, musl).
    name: build (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # NativeAOT cannot cross-compile across operating systems: each RID builds
        # on a runner of its own OS. Mirrors the release workflow matrix.
        include:
          - { rid: win-x64,          os: windows-latest }
          - { rid: win-arm64,        os: windows-11-arm }
          - { rid: linux-x64,        os: ubuntu-latest }
          - { rid: linux-arm64,      os: ubuntu-24.04-arm }
          - { rid: linux-musl-x64,   os: ubuntu-latest,     musl: true }
          - { rid: linux-musl-arm64, os: ubuntu-24.04-arm,  musl: true }
          - { rid: osx-x64,          os: macos-latest }
          - { rid: osx-arm64,        os: macos-latest }

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: ${{ needs.changes.outputs.code == 'true' }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: ${{ needs.changes.outputs.code == 'true' && !matrix.musl }}
        with:
          dotnet-version: '10.x'

      - name: Install AOT prerequisites (Linux)
        if: ${{ needs.changes.outputs.code == 'true' && startsWith(matrix.os, 'ubuntu') && !matrix.musl }}
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish native AOT binary
        if: ${{ needs.changes.outputs.code == 'true' && !matrix.musl }}
        run: dotnet publish mdr.csproj -c Release -r ${{ matrix.rid }} -o publish

      - name: Publish native AOT binary (musl, Alpine container)
        if: ${{ needs.changes.outputs.code == 'true' && matrix.musl }}
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            mcr.microsoft.com/dotnet/sdk:10.0-alpine \
            sh -c "apk add --no-cache clang build-base zlib-dev zlib-static && \
                   dotnet publish mdr.csproj -c Release -r ${{ matrix.rid }} -o publish"
